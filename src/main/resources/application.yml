spring:
  application:
    name: clash-tools
  config:
    import: optional:classpath:clans.yml
  datasource:
    url: jdbc:h2:file:./data/clash-tools;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  charset:
    console: UTF-8

clash:
  api:
    base-url: https://api.clashofclans.com/v1
    bearer-token: ${CLASH_API_TOKEN:}
    token-file: ${CLASH_TOKEN_FILE:./secrets/token.txt}
  league-group-endpoint: ${clash.api.base-url}/clans/{tag}/currentwar/leaguegroup
  war-endpoint: ${clash.api.base-url}/clanwarleagues/wars/{tag}
  output:
    directory: ${CLASH_OUTPUT_DIR:./output}
    filename-prefix: LigaMensal
